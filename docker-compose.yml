version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lexaudit_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - lex_audit_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lexaudit_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lex_audit_data:
