<div class="relative w-full min-h-[500px] flex flex-col items-center justify-center py-10 px-4 overflow-hidden">
  
  <!-- ═══ Stealth Watermark Background (Auto X-Ray Sweep) ═══ -->
  <!-- Container is strictly sized to prevent page overflow -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none select-none" aria-hidden="true">
    
    <!-- Base Layer: Barely visible watermark (Solid Color, No Opacity) -->
    <div class="absolute inset-0 flex items-center justify-center">
      <p class="text-[clamp(4rem,12vw,14rem)] font-black tracking-tighter text-center whitespace-nowrap text-blackMuted">
        {{ 'AUDIT.SCANNING.WATERMARK' | translate }}
      </p>
    </div>

    <!-- Reveal Layer: Sweeping Golden Spotlight -->
    <div 
      class="absolute inset-0 flex items-center justify-center bg-clip-text"
      style="-webkit-background-clip: text; color: transparent;"
      [style.backgroundImage]="'radial-gradient(circle 180px at ' + spotlightX + '% 50%, #FBBF24 0%, transparent 100%)'"
    >
      <p class="text-[clamp(4rem,12vw,14rem)] font-black tracking-tighter text-center whitespace-nowrap">
        {{ 'AUDIT.SCANNING.WATERMARK' | translate }}
      </p>
    </div>
    
  </div>

  <!-- Illustration Scanner -->
  <div class="relative z-10 w-full max-w-sm flex items-center justify-center">
    <app-audit-illustration class="w-full" [file]="file" [theme]="'dark'"></app-audit-illustration>
  </div>
  
</div>
