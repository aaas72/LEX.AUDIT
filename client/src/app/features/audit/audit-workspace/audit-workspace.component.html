<div class="min-h-screen bg-black text-brandYellow flex flex-col font-sans">
  
  <!-- Minimal Custom Header -->
  <header class="w-full px-6 md:px-12 py-6 flex items-center justify-between z-50">
    <div class="flex flex-col items-start text-start">
      <h1 class="text-2xl md:text-3xl font-black tracking-tight text-brandYellow leading-none mb-1">
        <a routerLink="/" class="hover:opacity-80 transition-opacity">LEX.AUDIT</a> <span class="text-brandYellowMuted">{{ 'AUDIT.WORKSPACE_TITLE' | translate }}</span>
      </h1>
      <p class="text-brandYellowDim text-xs md:text-sm">{{ 'AUDIT.WORKSPACE_SUBTITLE' | translate }}</p>
    </div>
    <div class="flex items-center gap-4">
      <app-language-selector [theme]="'dark'"></app-language-selector>
      <a routerLink="/" class="text-xs font-bold uppercase tracking-wider text-brandYellowDim hover:text-brandYellow transition-colors flex items-center gap-1">
        {{ 'NAVBAR.HOME' | translate }}
      </a>
    </div>
  </header>

  <div class="max-w-7xl w-full mx-auto flex flex-col pt-12 pb-8 px-6 md:px-12">
    <!-- State Machine Container -->
    <div class="flex flex-col relative z-0" [ngSwitch]="currentState">
      
      <!-- Upload State -->
      <app-upload-zone *ngSwitchCase="'upload'" (fileSelected)="onFileUploaded($event)"></app-upload-zone>

      <!-- Processing State -->
      <app-scanning-progress *ngSwitchCase="'processing'" [file]="uploadedFile"></app-scanning-progress>

      <!-- Results State -->
      <app-audit-results *ngSwitchCase="'results'"></app-audit-results>

    </div>
  </div>
</div>
