<div class="min-h-screen bg-black text-brandYellow flex flex-col font-sans">
  
  <!-- Minimal Custom Header -->
  <header class="w-full px-6 md:px-12 py-6 flex items-center justify-between z-50">
    <div class="flex flex-col items-start text-start">
      <a routerLink="/" class="text-2xl md:text-3xl font-black font-brand tracking-tight text-brandYellow hover:text-white transition-colors">
        LEX.AUDIT
      </a>
      <p class="text-brandYellowMuted text-xs md:text-sm mt-1 font-medium">{{ 'AUDIT.WORKSPACE_SUBTITLE' | translate }}</p>
    </div>
    <div class="flex items-center gap-4">
      <a routerLink="/" class="text-xs font-bold uppercase tracking-wider text-brandYellowMuted hover:text-brandYellow transition-colors flex items-center gap-1.5 cursor-pointer">
        <ng-icon [name]="langService.currentLang() === 'ar' ? 'lucideArrowRight' : 'lucideArrowLeft'" size="13px"></ng-icon>
        <span>{{ 'NAVBAR.HOME' | translate }}</span>
      </a>
      <div class="h-3.5 w-px bg-brandYellowMuted/30"></div>
      <app-language-selector [theme]="'dark'"></app-language-selector>
    </div>
  </header>

  <div class="max-w-7xl w-full mx-auto flex flex-col pt-12 pb-8 px-6 md:px-12">
    <!-- State Machine Container -->
    <div class="flex flex-col relative z-0" [ngSwitch]="currentState">
      
      <!-- Upload State -->
      <app-upload-zone *ngSwitchCase="'upload'" (fileSelected)="onFileUploaded($event)" [errorMessage]="errorMessage"></app-upload-zone>

      <!-- Processing State -->
      <app-scanning-progress *ngSwitchCase="'processing'" [file]="uploadedFile"></app-scanning-progress>

      <!-- Results State -->
      <app-audit-results *ngSwitchCase="'results'"></app-audit-results>

    </div>
  </div>
</div>
