<div class="h-screen overflow-hidden bg-black text-white flex flex-col font-sans">
  
  <!-- Minimal Custom Header -->
  <header class="w-full px-6 md:px-12 py-6 flex items-center justify-between z-50">
    <div class="flex flex-col items-start text-left">
      <h1 class="text-2xl md:text-3xl font-black tracking-tight text-white leading-none mb-1">LEX.AUDIT <span class="text-brandYellow">WORKSPACE</span></h1>
      <p class="text-white/60 text-xs md:text-sm">Secure environment for AI contract analysis.</p>
    </div>
  </header>

  <div class="max-w-7xl w-full mx-auto flex-1 flex flex-col pt-12 pb-8 px-6 md:px-12">
    <!-- State Machine Container -->
    <div class="flex-1 flex flex-col relative z-0" [ngSwitch]="currentState">
      
      <!-- Upload State -->
      <app-upload-zone *ngSwitchCase="'upload'" (fileSelected)="onFileUploaded($event)"></app-upload-zone>

      <!-- Processing State -->
      <app-scanning-progress *ngSwitchCase="'processing'" [file]="uploadedFile"></app-scanning-progress>

      <!-- Results State -->
      <app-audit-results *ngSwitchCase="'results'"></app-audit-results>

    </div>
  </div>
</div>
