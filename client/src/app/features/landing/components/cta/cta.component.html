<section class="py-32 bg-transparent text-black relative overflow-hidden">
  
  <!-- Decorative Background elements -->
  <div class="absolute top-0 end-0 w-96 h-96 bg-black/5 rounded-full blur-[100px] -translate-y-1/2 translate-x-1/2"></div>
  <div class="absolute bottom-0 start-0 w-96 h-96 bg-black/5 rounded-full blur-[100px] translate-y-1/2 -translate-x-1/2"></div>

  <div class="max-w-4xl mx-auto px-4 md:px-8 text-center relative z-10" appAnimateOnScroll="animate-fade-in-up">
    <h2 class="text-5xl md:text-7xl font-bold tracking-tight mb-8">{{ 'CTA.TITLE' | translate }}</h2>
    <p class="text-xl text-blackMuted mb-12 max-w-2xl mx-auto">
      {{ 'CTA.SUBTITLE' | translate }}
    </p>
    
    <app-ui-button [text]="'CTA.BUTTON' | translate"></app-ui-button>
  </div>
</section>
