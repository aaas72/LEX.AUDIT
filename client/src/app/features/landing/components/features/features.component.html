<section class="py-24 bg-black text-brandYellow relative">
  <app-container>
    <div class="max-w-7xl mx-auto px-4 md:px-8">

      <!-- Section Header -->
      <div class="text-center max-w-3xl mx-auto mb-20" appAnimateOnScroll="animate-fade-in-up">
        <h2 class="text-xs tracking-widest uppercase font-semibold text-brandYellow mb-4">{{ 'FEATURES.SECTION_LABEL' | translate }}</h2>
        <h3 class="text-4xl md:text-5xl font-medium tracking-tight mb-6">{{ 'FEATURES.TITLE' | translate }}</h3>
        <p class="text-brandYellowMuted text-lg">
          {{ 'FEATURES.SUBTITLE' | translate }}
        </p>
      </div>

      <!-- Features Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

        <div *ngFor="let feature of features; let i = index" appAnimateOnScroll="animate-fade-in-up"
          [animationDelay]="i * 150 + 'ms'"
          class="group relative overflow-hidden z-0 p-8 rounded-2xl border-2 border-brandYellow/10 bg-transparent transition-all duration-500 flex flex-col items-start text-start">

          <!-- The Inspection Lens (Spotlight Effect) -->
          <span
            class="absolute top-[64px] ltr:left-[64px] rtl:right-[64px] w-0 h-0 rounded-full ltr:-translate-x-1/2 rtl:translate-x-1/2 -translate-y-1/2 transition-all duration-700 ease-out -z-10 group-hover:w-[600px] group-hover:h-[600px] bg-brandYellow"></span>

          <div
            class="relative z-10 w-16 h-16 rounded-full border border-brandYellow/20 flex items-center justify-center mb-6 shrink-0 group-hover:border-black/20 transition-all duration-500">
            <ng-icon [name]="feature.icon" size="24px" strokeWidth="2"
              class="text-brandYellow group-hover:text-black transition-colors duration-500"></ng-icon>
          </div>

          <h4
            class="relative z-10 text-xl font-semibold mb-3 text-brandYellow group-hover:text-black transition-colors duration-500">
            {{ feature.titleKey | translate }}</h4>
          <p
            class="relative z-10 text-brandYellowMuted leading-relaxed text-sm md:text-base group-hover:text-blackMuted transition-colors duration-500">
            {{ feature.descKey | translate }}
          </p>
        </div>

      </div>
    </div>
  </app-container>
</section>
