<section class="py-24 md:py-32 bg-black text-brandYellow relative">
  <div class="max-w-7xl mx-auto px-4 md:px-8 relative z-10">
    
    <div class="text-center mb-20" appAnimateOnScroll="animate-fade-in-up">
      <h2 class="text-4xl md:text-6xl font-black tracking-tighter mb-4 uppercase">{{ 'HOW_IT_WORKS.TITLE' | translate }}</h2>
      <p class="text-xl text-brandYellowMuted max-w-2xl mx-auto">{{ 'HOW_IT_WORKS.SUBTITLE' | translate }}</p>
    </div>

    <div class="flex flex-col gap-6 max-w-4xl mx-auto">
      <div *ngFor="let step of steps; let i = index" 
           class="relative overflow-hidden group p-8 md:p-12 rounded-2xl border border-brandYellow/20 bg-transparent flex flex-col md:flex-row items-start md:items-center gap-8 transition-transform duration-500 hover:-translate-y-2 z-0"
           appAnimateOnScroll="animate-fade-in-up" [animationDelay]="(i * 150) + 'ms'">
           
        <!-- The Inspection Lens (Spotlight Effect) -->
        <span class="absolute top-[72px] ltr:left-[72px] rtl:right-[72px] md:top-1/2 md:ltr:left-[88px] md:rtl:right-[88px] w-0 h-0 rounded-full ltr:-translate-x-1/2 rtl:translate-x-1/2 -translate-y-1/2 transition-all duration-700 ease-out -z-[20] group-hover:w-[1500px] group-hover:h-[1500px] bg-brandYellow"></span>

        <!-- Massive Background Number -->
        <div class="text-7xl md:text-9xl font-black text-blackMuted group-hover:text-blackDim transition-colors duration-500 absolute -top-4 end-4 md:end-8 select-none -z-10">
          0{{ i + 1 }}
        </div>

        <!-- Icon (Must be Circular Border per identity rules) -->
        <div class="w-20 h-20 rounded-full border border-brandYellow/20 flex items-center justify-center shrink-0 group-hover:border-black/20 transition-colors duration-500">
          <ng-icon [name]="step.icon" size="36px" strokeWidth="2" class="text-brandYellow group-hover:text-black transition-colors duration-500"></ng-icon>
        </div>
        
        <!-- Text Content -->
        <div class="relative z-10">
          <h3 class="text-2xl md:text-3xl font-bold mb-3 text-brandYellow group-hover:text-black transition-colors duration-500">{{ step.titleKey | translate }}</h3>
          <p class="text-brandYellowMuted group-hover:text-blackMuted leading-relaxed text-lg transition-colors duration-500 max-w-2xl">{{ step.descKey | translate }}</p>
        </div>
        
      </div>
    </div>

  </div>
</section>
