<div class="relative min-h-screen bg-black text-white font-sans overflow-x-hidden flex flex-col">
  
  <app-navbar theme="dark"></app-navbar>

  <main class="flex-grow">
    <section class="py-24 md:py-32">
      <div class="max-w-7xl mx-auto px-4 md:px-8">
        
        <div class="text-center max-w-3xl mx-auto mb-20" appAnimateOnScroll="animate-fade-in-up">
          <h1 class="text-5xl md:text-7xl font-black tracking-tighter leading-none mb-6">TRANSPARENT PRICING.</h1>
          <p class="text-xl text-white/70">No hidden clauses. Choose the plan that scales with your risk mitigation needs.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <app-pricing-card 
             *ngFor="let plan of plans; let i = index" 
             [plan]="plan"
             appAnimateOnScroll="animate-fade-in-up" 
             [animationDelay]="i * 150 + 'ms'">
          </app-pricing-card>
        </div>

      </div>
    </section>
  </main>

  <app-footer></app-footer>

</div>
