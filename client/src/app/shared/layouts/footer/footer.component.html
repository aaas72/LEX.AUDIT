<footer class="bg-black text-white/70 pt-24 pb-8">
  <div class="max-w-7xl mx-auto px-4 md:px-8">
    
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-16 mb-24" appAnimateOnScroll="animate-fade-in-up">
      
      <!-- Massive Brand & Contact with Lens Effect -->
      <div>
        <h2 
          (mousemove)="updateLensPosition($event)"
          class="relative text-6xl md:text-8xl font-black tracking-tighter mb-4 cursor-crosshair w-fit group"
        >
          <!-- Base Text -->
          <span class="text-white/5 group-hover:text-transparent transition-colors duration-500 inline-block">LEX.AUDIT</span>
          
          <!-- Spotlight/Lens Overlay -->
          <span 
            class="absolute left-0 top-0 w-full h-full text-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none inline-block"
            style="background-clip: text; -webkit-background-clip: text;"
            [style.backgroundImage]="'radial-gradient(circle 120px at ' + mouseX + 'px ' + mouseY + 'px, #FBBF24 0%, transparent 100%)'"
          >
            LEX.AUDIT
          </span>
        </h2>
        <a href="mailto:contact&#64;lex.audit" class="text-xl md:text-2xl font-medium text-brandYellow hover:text-white transition-colors">
          contact&#64;lex.audit
        </a>
      </div>

      <!-- Fixed Pages (Horizontal) -->
      <div class="flex flex-wrap gap-8 items-end md:pb-2">
        <a href="#" class="text-sm font-medium hover:text-brandYellow transition-colors">Privacy Policy</a>
        <a href="#" class="text-sm font-medium hover:text-brandYellow transition-colors">Terms of Service</a>
        <a href="#" class="text-sm font-medium hover:text-brandYellow transition-colors">Cookie Policy</a>
      </div>

    </div>

    <!-- Bottom Bar -->
    <div class="pt-8 border-t border-white/10 flex flex-col md:flex-row justify-between items-center gap-4 text-xs font-semibold tracking-wide">

      <div class="flex gap-4">
        <a href="#" class="relative overflow-hidden group w-12 h-12 rounded-full border border-white/20 flex items-center justify-center text-white/50 transition-colors duration-500 hover:border-brandYellow hover:text-black z-0" aria-label="Twitter">
          <span class="absolute top-1/2 left-1/2 w-0 h-0 bg-brandYellow rounded-full -translate-x-1/2 -translate-y-1/2 group-hover:w-24 group-hover:h-24 transition-all duration-500 ease-out -z-10"></span>
          <svg class="relative z-10" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg>
        </a>
        <a href="#" class="relative overflow-hidden group w-12 h-12 rounded-full border border-white/20 flex items-center justify-center text-white/50 transition-colors duration-500 hover:border-brandYellow hover:text-black z-0" aria-label="LinkedIn">
